name: Daily contribution

on:
  schedule:
    # GitHub Actions の cron は UTC。
    # Australia/Brisbane は通年 UTC+10（サマータイムなし）。
    # 15:10 UTC = ブリスベンの 01:10。
    # 実行が数分〜数時間遅れても、同じ日のコントリビューションとして残る。
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-contribution
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Commit and push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "oto0928"
          git config user.email "toa0928koron@icloud.com"

          # 3〜10件。日によって濃さが変わるようにする。
          COUNT=$((3 + RANDOM % 8))
          echo "Creating ${COUNT} commits"
          mkdir -p .github

          for i in $(seq 1 "${COUNT}"); do
            {
              echo "count: ${COUNT}"
              echo "index: ${i}"
              TZ=Australia/Brisbane date '+%Y-%m-%d %H:%M:%S.%N %Z'
            } > .github/contribution-log.txt
            git add .github/contribution-log.txt
            git commit -m "chore: daily contribution (${i}/${COUNT})"
          done

          git push origin "HEAD:${DEFAULT_BRANCH}"
