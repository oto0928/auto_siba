name: Daily contribution

on:
  schedule:
    # GitHub Actions の cron は UTC。
    # Australia/Brisbane は通年 UTC+10（サマータイムなし）。
    # 15:05 UTC = ブリスベンの 01:05。
    # 実行が数分〜数時間遅れても、同じ日のコントリビューションとして残る。
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-contribution
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update contribution log
        run: |
          mkdir -p .github
          TZ=Australia/Brisbane date '+%Y-%m-%d %H:%M:%S %Z' > .github/contribution-log.txt

      - name: Commit and push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/contribution-log.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: daily contribution"
          git push origin "HEAD:${DEFAULT_BRANCH}"
